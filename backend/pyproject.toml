[project]
name = "izolator-secim-atolyesi"
version = "1.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.162.0",
    "numpy==2.5.4",
    "pydantic==2.14.1",
    "scipy==1.18.1",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
