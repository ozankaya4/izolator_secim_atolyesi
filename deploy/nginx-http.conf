# New virtual host only. Existing domains and the default host are untouched.
server {
    listen 80;
    server_name ozankaya.net;
    server_tokens off;
    access_log /var/log/nginx/izolator.access.log;
    error_log /var/log/nginx/izolator.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ozankaya-acme;
        default_type text/plain;
    }
    location = /izolator { return 308 /izolator/; }
    location ^~ /izolator/ {
        proxy_pass http://127.0.0.1:18180/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /izolator;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        client_max_body_size 2m;
    }
    location / { return 404; }
}
